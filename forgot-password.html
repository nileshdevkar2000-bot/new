<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Recovery | NEO</title><link rel="icon" href="assets/neo-mark.svg"><link rel="stylesheet" href="assets/neo.css"><script defer src="assets/neo.js"></script></head><body class="theme-aurora"><main class="container page-hero"><div class="contact-card" style="max-width:640px;margin:auto"><div class="eyebrow gradient">ACCOUNT RECOVERY</div><h1>Recover your NEO account</h1><p class="module-muted">System Administrator recovery is routed to the configured NEO recovery mailbox. Other approved users recover through their registered work email.</p><section id="requestPane"><form id="forgotForm" class="form-card"><label>Account email<input id="recoveryEmail" type="email" required placeholder="you@company.com"></label><button class="btn btn-primary" type="submit">Send recovery link</button><div id="forgotMsg" class="small-message"></div><div id="recoveryPreview" class="login-demo-card" hidden></div></form></section><section id="resetPane" hidden><form id="resetForm" class="form-card"><label>New password<div class="password-wrap"><input id="newPassword" type="password" minlength="8" required><button type="button" class="password-toggle" id="toggleNew">Show</button></div></label><label>Confirm password<input id="confirmPassword" type="password" minlength="8" required></label><button class="btn btn-primary" type="submit">Reset password</button><div id="resetMsg" class="small-message"></div></form></section><p style="margin-top:18px"><a href="login.html">← Back to login</a></p></div></main><script>
const token=new URLSearchParams(location.search).get('token');if(token){requestPane.hidden=true;resetPane.hidden=false}
forgotForm.addEventListener('submit',async e=>{e.preventDefault();forgotMsg.textContent='Requesting recovery…';try{const r=await fetch('/api/password/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:recoveryEmail.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Recovery request failed');forgotMsg.textContent=d.message||'If eligible, recovery instructions have been sent.';if(d.testResetUrl){recoveryPreview.hidden=false;recoveryPreview.innerHTML='<b>Local development recovery</b><a href="'+d.testResetUrl+'">Open recovery link</a>';}}catch(err){forgotMsg.textContent=err.message}});
toggleNew.addEventListener('click',()=>{newPassword.type=newPassword.type==='password'?'text':'password';toggleNew.textContent=newPassword.type==='password'?'Show':'Hide'});
resetForm.addEventListener('submit',async e=>{e.preventDefault();if(newPassword.value!==confirmPassword.value){resetMsg.textContent='Passwords do not match.';return}resetMsg.textContent='Resetting…';try{const r=await fetch('/api/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:newPassword.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Reset failed');resetMsg.textContent=d.message||'Password reset complete.';setTimeout(()=>location.href='/login.html',700)}catch(err){resetMsg.textContent=err.message}});
</script></body></html>
