<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request NEO Access</title><link rel="icon" href="assets/neo-mark.svg"><link rel="stylesheet" href="assets/neo.css"><script defer src="assets/neo.js"></script></head><body class="theme-aurora"><main class="container page-hero"><div class="contact-card" style="max-width:760px;margin:auto"><div class="eyebrow gradient">NEO ACCESS REQUEST</div><h1>Request workspace access</h1><p class="module-muted">Every request is routed to an existing System Administrator for approval. Multiple System Administrator accounts are supported. No workspace or department data is exposed before approval and sign-in.</p><form class="form-card" id="signupForm"><label>Full name<input id="signupName" required autocomplete="name"></label><label>Work email<input id="signupEmail" type="email" required autocomplete="email"></label><label>Preferred login ID (optional)<input id="signupLogin" placeholder="firstname.lastname" autocomplete="username"></label><label>Password (optional)<div class="password-wrap"><input id="signupPassword" type="password" minlength="10" placeholder="Set your password or let Admin issue one" autocomplete="new-password"><button type="button" class="password-toggle" id="toggleSignupPassword">Show</button></div></label><div class="auth-two"><label>Department<select id="signupDept" required><option value="">Select department</option></select></label><label>Requested role<select id="signupRole" required><option value="">Select role</option></select></label></div><button class="btn btn-primary" type="submit">Send for System Administrator approval</button><div id="signupMsg" class="small-message"></div></form><p style="margin-top:18px"><a href="login.html">Already approved? Sign in</a> · <a href="index.html">Back to NEO introduction</a></p></div></main><script>
const form=document.getElementById('signupForm'), msg=document.getElementById('signupMsg'), dept=document.getElementById('signupDept'), role=document.getElementById('signupRole');
const fallback={"Quality Assurance":["QA User","QA Reviewer","QA Manager"],"Quality Control":["QC Analyst","QC Reviewer","QC Manager"],"Manufacturing":["Manufacturing User","Manufacturing Reviewer","Manufacturing Manager"],"Production":["Production User","Production Reviewer","Production Manager"],"Supply Chain":["Supply Chain User","Supplier Quality Reviewer","Supply Chain Manager"],"R&D":["Scientist","R&D Reviewer","R&D Manager"],"Clinical Trial":["Clinical Operations User","Clinical Reviewer","Clinical Study Manager","Site / Feasibility Analyst"],"Regulatory Affairs":["Regulatory Operations User","Regulatory Reviewer","Regulatory Manager"],"Pharmacovigilance":["PV Case Processor","PV Reviewer","PV Signal Analyst","PV Manager"],"Complaint Handling":["Complaint Specialist","Complaint Reviewer","Complaint Manager"],"Opex & Continuous Improvement":["Continuous Improvement Analyst","Process Reviewer","Opex Manager"],"Medical Affairs":["Medical Information Specialist","Medical Reviewer","Medical Manager"],"IT & Digital Operations":["IT Service User","IT Reviewer","IT Manager"],"System Administration":["System Administrator"]};
async function loadOptions(){try{const r=await fetch('/api/registration-options',{credentials:'same-origin'});const d=await r.json();const departments=d.departments||Object.keys(fallback);dept.innerHTML='<option value="">Select department</option>'+departments.map(x=>`<option>${x}</option>`).join('');window._roles=d.roles||fallback;}catch{window._roles=fallback;dept.innerHTML='<option value="">Select department</option>'+Object.keys(fallback).map(x=>`<option>${x}</option>`).join('')}}
function updateRoles(){const roles=window._roles?.[dept.value]||['Department User','Department Reviewer','Department Manager'];role.innerHTML='<option value="">Select role</option>'+roles.map(x=>`<option>${x}</option>`).join('');}
document.getElementById('toggleSignupPassword').addEventListener('click',()=>{const x=document.getElementById('signupPassword');x.type=x.type==='password'?'text':'password';document.getElementById('toggleSignupPassword').textContent=x.type==='password'?'Show':'Hide'});
dept.addEventListener('change',updateRoles); loadOptions().then(updateRoles);
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Submitting access request…';msg.classList.remove('error');try{const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({name:signupName.value,email:signupEmail.value,loginId:signupLogin.value,password:signupPassword.value,department:dept.value,profileRole:role.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Signup request failed');msg.textContent=d.message||'Access request submitted. Wait for System Administrator approval.';form.reset();updateRoles();}catch(err){msg.textContent=err.message||'Unable to submit access request.'}});
</script></body></html>
