<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | NEO</title><link rel="icon" href="assets/neo-mark.svg"><link rel="stylesheet" href="assets/neo.css"><script defer src="assets/neo.js"></script></head><body class="theme-aurora"><main class="container page-hero"><div class="contact-card" style="max-width:620px;margin:auto"><div class="eyebrow gradient">NEO ACCESS</div><h1>Enter NEO</h1><p class="module-muted">Your workspace becomes available only after authenticated, approved access.</p><div id="reasonMessage" class="small-message"></div><div id="serverStatus" class="small-message"></div><div id="demoCredentials" class="login-demo-card" hidden></div><form id="loginForm" class="form-card"><label>Login ID<input id="loginId" autocomplete="username" required placeholder="your.login"></label><label>Password<div class="password-wrap"><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Password"><button type="button" class="password-toggle" id="toggleLoginPassword">Show</button></div></label><button class="btn btn-primary" type="submit">Enter workspace</button><div id="loginMessage" class="small-message"></div></form><div class="cta-row" style="justify-content:space-between"><a href="forgot-password.html">Forgot password?</a><a href="signup.html">Request access</a></div><p style="margin-top:18px"><a href="index.html">← Back to NEO introduction</a></p></div></main><script>
const form=document.getElementById('loginForm'),msg=document.getElementById('loginMessage'),serverStatus=document.getElementById('serverStatus'),demo=document.getElementById('demoCredentials');
const reason=new URLSearchParams(location.search).get('reason'); if(reason==='timeout') document.getElementById('reasonMessage').textContent='Your session expired after 3 minutes of inactivity. Please sign in again.'; else if(reason==='logout') document.getElementById('reasonMessage').textContent='You have been signed out.';
document.getElementById('toggleLoginPassword').addEventListener('click',()=>{const x=document.getElementById('loginPassword');x.type=x.type==='password'?'text':'password';document.getElementById('toggleLoginPassword').textContent=x.type==='password'?'Show':'Hide'});
(async()=>{try{const r=await fetch('/api/session',{credentials:'same-origin',cache:'no-store'});const d=await r.json();serverStatus.textContent=r.ok?'NEO backend connected.':'NEO backend responded with an error.';if(d.mode==='demo'){demo.hidden=false;demo.innerHTML='<b>Prototype demo access</b><span>System Admin · neo.admin / Admin@123</span><span>QA · qa.user / QA@123</span><span>QC · qc.user / QC@123</span>';}const p=await fetch('/api/public-status',{cache:'no-store'});const ps=await p.json().catch(()=>({}));if(ps.mode==='production'&&!ps.adminProvisioned)serverStatus.textContent+=' System Administrator is not provisioned; run the first-run setup.';if(ps.mode==='production'&&!ps.recoveryConfigured)serverStatus.textContent+=' Production email recovery is not configured yet.';}catch{serverStatus.textContent='NEO backend is not reachable. Start the NEO server with the included start script before signing in.';serverStatus.classList.add('error')}})();
form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';msg.classList.remove('error');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({id:document.getElementById('loginId').value,password:document.getElementById('loginPassword').value})});const d=await r.json().catch(()=>({}));if(!r.ok){if(d.code==='ACCOUNT_PENDING_APPROVAL')msg.textContent=d.error+' Check back after System Administrator approval.';else if(d.code==='PASSWORD_RESET_REQUIRED')msg.textContent=d.error+' Open Forgot password to recover the account.';else throw new Error(d.error||'Login ID/email or password is incorrect.');msg.classList.add('error');return}const requested=new URLSearchParams(location.search).get('next')||'';const next=(requested.startsWith('/')&&!requested.startsWith('//'))?requested:'/workspace.html';location.href=next;}catch(err){msg.textContent=err.message||'Unable to sign in. If the NEO backend is not running, use the included start script.';msg.classList.add('error');}});
</script></body></html>
